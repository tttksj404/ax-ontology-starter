[project]
name = "ax-ontology-starter"
version = "0.3.0"
description = "업무 진단, 온톨로지 RAG, 검토된 LLM Wiki, 승인 기반 AX 참조 구현"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "PyJWT[crypto]>=2.15.1,<3",
  "fastapi>=0.128,<1",
  "pydantic>=2.12,<3",
  "typer>=0.21,<1",
  "httpx2[http2,brotli,zstd]==2.13.1",
  "orjson>=3.11,<4",
  "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = ["basedpyright>=1.31", "ruff>=0.14", "pytest>=9", "pytest-cov>=7", "httpx>=0.28,<1"]

[project.scripts]
ax = "ax_starter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax_starter"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportUnusedCallResult = "warning"
# Exhaustive enum guards intentionally handle Never; new variants still fail assert_never.
reportUnreachable = false
reportUnnecessaryComparison = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# AXError takes a typed machine reason code, rather than a prose exception message.
ignore = ["COM812", "D203", "D213", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "FBT001", "FBT002", "CPY001", "EM101"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "PLR2004", "ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["ax_starter"]
